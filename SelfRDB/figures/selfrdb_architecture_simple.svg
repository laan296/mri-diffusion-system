<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DFF7F3"/>
      <stop offset="1" stop-color="#C7EFE8"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E5F0FF"/>
      <stop offset="1" stop-color="#D1E4FF"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF4D6"/>
      <stop offset="1" stop-color="#FFE8A3"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0E8FF"/>
      <stop offset="1" stop-color="#E1D2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9AA6B2" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#526071"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#8191A3"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1F2937; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #5B6777; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #223042; }
      .label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #213040; }
      .body { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #536274; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #617286; }
      .tiny { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #5B6777; letter-spacing: 1.2px; }
      .formula { font: 700 18px 'Consolas', 'Courier New', monospace; fill: #253445; }
      .white { fill: white; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="860" rx="32" fill="url(#bg)"/>

  <text x="76" y="82" class="title">SelfRDB Model Architecture</text>
  <text x="76" y="116" class="subtitle">MRI modality translation with diffusion bridge and self-recursive generation</text>

  <rect x="70" y="160" width="1260" height="440" rx="30" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="210" class="section">Inference Pipeline</text>

  <rect x="105" y="258" width="195" height="250" rx="26" fill="url(#blueCard)" stroke="#BFD3F4" stroke-width="2"/>
  <rect x="142" y="300" width="120" height="120" rx="20" fill="#1F2937" opacity="0.9"/>
  <circle cx="202" cy="360" r="42" fill="#D7DDE5"/>
  <ellipse cx="202" cy="360" rx="46" ry="38" fill="#4B5563"/>
  <ellipse cx="202" cy="360" rx="31" ry="25" fill="#CBD5E1"/>
  <ellipse cx="202" cy="360" rx="19" ry="14" fill="#6B7280"/>
  <text x="136" y="456" class="label">Source MRI</text>
  <text x="173" y="486" class="formula">y (T1)</text>

  <rect x="345" y="258" width="210" height="250" rx="26" fill="url(#tealCard)" stroke="#BCE3DA" stroke-width="2"/>
  <rect x="392" y="292" width="116" height="52" rx="16" fill="#FFFFFF" stroke="#C7D2DE"/>
  <text x="421" y="325" class="formula">Resize</text>
  <rect x="392" y="358" width="116" height="52" rx="16" fill="#FFFFFF" stroke="#C7D2DE"/>
  <text x="404" y="391" class="formula">Normalize</text>
  <rect x="392" y="424" width="116" height="52" rx="16" fill="#FFFFFF" stroke="#C7D2DE"/>
  <text x="404" y="457" class="formula">Tensorize</text>
  <text x="384" y="486" class="label">Input Processing</text>

  <rect x="600" y="230" width="285" height="305" rx="28" fill="url(#goldCard)" stroke="#F0CF7E" stroke-width="2"/>
  <text x="652" y="278" class="label">Diffusion Bridge</text>
  <rect x="635" y="308" width="215" height="56" rx="18" fill="#FFFFFF" stroke="#E6D7A8"/>
  <text x="668" y="343" class="formula">q(x_t | x_0, y)</text>
  <rect x="635" y="388" width="215" height="56" rx="18" fill="#FFFFFF" stroke="#E6D7A8"/>
  <text x="640" y="423" class="formula">Noise schedule + states x_t</text>
  <text x="635" y="480" class="small">Builds a bridge from condition image</text>
  <text x="651" y="503" class="small">to target-state diffusion trajectory</text>

  <rect x="930" y="210" width="300" height="345" rx="28" fill="url(#purpleCard)" stroke="#D2C2F4" stroke-width="2"/>
  <text x="977" y="258" class="label">Self-Recursive Generator</text>
  <rect x="968" y="292" width="224" height="66" rx="20" fill="#FFFFFF" stroke="#D7C9F1"/>
  <text x="993" y="333" class="formula">G(theta)(x_t, t, y, x_0^r)</text>
  <rect x="968" y="378" width="224" height="58" rx="18" fill="#FFFFFF" stroke="#D7C9F1"/>
  <text x="988" y="414" class="formula">repeat R times</text>
  <rect x="968" y="452" width="224" height="58" rx="18" fill="#FFFFFF" stroke="#D7C9F1"/>
  <text x="986" y="488" class="formula">until consistency</text>
  <text x="1002" y="530" class="small">Predicts x_0 and refines it</text>

  <rect x="1260" y="258" width="35" height="250" rx="16" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="2"/>
  <path d="M1278 288 L1278 478" stroke="#8191A3" stroke-width="4" stroke-linecap="round" marker-end="url(#softArrow)"/>
  <text x="1268" y="246" class="tiny">t</text>
  <text x="1266" y="495" class="tiny">0</text>

  <rect x="1100" y="624" width="195" height="146" rx="24" fill="url(#blueCard)" stroke="#BFD3F4" stroke-width="2"/>
  <rect x="1137" y="652" width="120" height="70" rx="18" fill="#1F2937" opacity="0.9"/>
  <circle cx="1197" cy="687" r="30" fill="#D7DDE5"/>
  <ellipse cx="1197" cy="687" rx="33" ry="27" fill="#374151"/>
  <ellipse cx="1197" cy="687" rx="21" ry="16" fill="#CBD5E1"/>
  <text x="1148" y="744" class="label">Generated MRI</text>
  <text x="1169" y="768" class="formula">x_0 (T2)</text>

  <rect x="70" y="640" width="970" height="130" rx="28" fill="#FFFDF7" stroke="#E9DFC5" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="102" y="688" class="section">Training Signal</text>
  <text x="102" y="720" class="body">Real pair: (x_t, x_(t-1))</text>
  <text x="372" y="720" class="body">Synthetic pair: (x_t, x_hat_(t-1))</text>
  <text x="716" y="720" class="body">Discriminator judges actual vs synthesized transition pairs</text>
  <rect x="804" y="668" width="170" height="60" rx="18" fill="#FFE9A7" stroke="#E3C968"/>
  <text x="842" y="705" class="label">D(theta)</text>

  <path d="M300 383 L345 383" stroke="#526071" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M555 383 L600 383" stroke="#526071" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M885 383 L930 383" stroke="#526071" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1080 555 L1080 624 L1100 624" stroke="#526071" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1080 555 C1080 605, 935 605, 935 668" stroke="#8191A3" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#softArrow)"/>
  <path d="M742 535 L742 600" stroke="#8191A3" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#softArrow)"/>

  <circle cx="742" cy="383" r="14" fill="#213040"/>
  <text x="737" y="389" class="white" style="font:700 14px 'Segoe UI', Arial, sans-serif;">t</text>
  <path d="M1095 540 C1148 540, 1182 571, 1182 624" stroke="#7A68C7" stroke-width="3.5" fill="none" marker-end="url(#softArrow)"/>
  <text x="1138" y="566" class="small">posterior</text>
  <text x="1139" y="586" class="small">sampling</text>

  <text x="101" y="815" class="subtitle">Simplified diagram for reports and slides: input image -> preprocessing -> diffusion bridge -> recursive generator -> posterior sampling -> generated modality</text>
</svg>
