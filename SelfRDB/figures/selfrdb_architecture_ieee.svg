<svg width="1800" height="980" viewBox="0 0 1800 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#374151"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#6B7280"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .section { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #4B5563; }
      .math { font: 700 18px Arial, Helvetica, sans-serif; fill: #1F2937; }
      .caption { font: 400 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <text x="90" y="78" class="title">SelfRDB Architecture for Medical Image Translation</text>

  <rect x="70" y="120" width="1660" height="760" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>

  <text x="98" y="165" class="section">Input Images</text>
  <text x="465" y="165" class="section">Diffusion Bridge Module</text>
  <text x="1100" y="165" class="section">Generator (NCSNpp)</text>
  <text x="1480" y="165" class="section">Discriminator</text>

  <rect x="95" y="225" width="300" height="220" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="130" y="270" width="100" height="100" rx="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.2"/>
  <rect x="155" y="292" width="50" height="56" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="0.9"/>
  <ellipse cx="180" cy="320" rx="23" ry="17" fill="#BFC5CD"/>
  <ellipse cx="180" cy="320" rx="13" ry="9" fill="#F9FAFB"/>
  <text x="136" y="395" class="label">Source MRI</text>
  <text x="151" y="422" class="math">T1, y</text>

  <rect x="255" y="270" width="100" height="100" rx="6" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.2"/>
  <rect x="280" y="292" width="50" height="56" rx="3" fill="#F3F4F6" stroke="#6B7280" stroke-width="0.9"/>
  <ellipse cx="305" cy="320" rx="23" ry="17" fill="#BFC5CD"/>
  <ellipse cx="305" cy="320" rx="13" ry="9" fill="#F9FAFB"/>
  <text x="258" y="395" class="label">Target MRI</text>
  <text x="274" y="422" class="math">T2, x₀</text>

  <rect x="440" y="225" width="600" height="360" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>

  <rect x="470" y="270" width="155" height="86" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
  <text x="497" y="308" class="label">Noise Addition</text>
  <text x="496" y="335" class="body">Forward process</text>

  <rect x="660" y="270" width="155" height="86" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
  <text x="684" y="308" class="label">Bridge Sampling</text>
  <text x="700" y="335" class="math">q(x<tspan baseline-shift="sub" font-size="13">t</tspan>|x₀, y)</text>

  <rect x="850" y="270" width="155" height="86" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
  <text x="866" y="308" class="label">Recursive Reverse</text>
  <text x="905" y="335" class="body">t = T → t = 1</text>

  <line x1="625" y1="313" x2="660" y2="313" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="815" y1="313" x2="850" y2="313" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="480" y="425" width="520" height="120" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.1"/>
  <text x="500" y="460" class="label">Intermediate diffusion states</text>
  <rect x="520" y="485" width="72" height="36" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="542" y="508" class="math">x<tspan baseline-shift="sub" font-size="13">T</tspan></text>
  <line x1="592" y1="503" x2="660" y2="503" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="660" y="485" width="72" height="36" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="680" y="508" class="math">x<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <line x1="732" y1="503" x2="800" y2="503" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="800" y="485" width="92" height="36" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="818" y="508" class="math">x<tspan baseline-shift="sub" font-size="13">t-1</tspan></text>
  <line x1="892" y1="503" x2="960" y2="503" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="960" y="485" width="72" height="36" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="980" y="508" class="math">x₁</text>

  <rect x="1075" y="225" width="350" height="360" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>

  <rect x="1110" y="270" width="280" height="84" rx="6" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.3"/>
  <text x="1188" y="307" class="label">NCSNpp Block</text>
  <text x="1160" y="334" class="body">Conditioned on x<tspan baseline-shift="sub" font-size="12">t</tspan>, t, y</text>

  <rect x="1110" y="392" width="80" height="60" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/>
  <text x="1127" y="428" class="math">Enc.</text>
  <line x1="1190" y1="422" x2="1255" y2="422" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1255" y="392" width="80" height="60" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/>
  <text x="1273" y="428" class="math">Mid</text>
  <line x1="1335" y1="422" x2="1400" y2="422" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1400" y="392" width="80" height="60" rx="5" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/>
  <text x="1415" y="428" class="math">Dec.</text>

  <rect x="1120" y="495" width="260" height="50" rx="5" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="1168" y="526" class="math">Step-by-step denoising to x₀</text>

  <rect x="1470" y="225" width="220" height="360" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.6"/>
  <rect x="1515" y="315" width="130" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.3"/>
  <text x="1538" y="349" class="label">Discriminator</text>
  <text x="1547" y="377" class="body">Real / Fake</text>

  <line x1="395" y1="335" x2="440" y2="335" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="1040" y1="335" x2="1075" y2="335" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <path d="M1425 422L1470 422" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>

  <path d="M1580 585L1580 700L815 700L815 585" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="7 6" fill="none" marker-end="url(#arrowDashed)"/>
  <text x="1160" y="690" class="body">Bridge loss feedback</text>

  <rect x="95" y="630" width="1535" height="160" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="120" y="668" class="section">Execution Flow</text>
  <text x="121" y="710" class="body">1. Source MRI and target MRI define the translation bridge.</text>
  <text x="121" y="740" class="body">2. The diffusion bridge adds noise and constructs intermediate states from t = T to t = 1.</text>
  <text x="121" y="770" class="body">3. The NCSNpp generator performs recursive denoising and predicts the translated image x₀.</text>
  <text x="890" y="710" class="body">4. The discriminator supervises real and synthesized transition pairs during training.</text>
  <text x="890" y="740" class="body">5. The dashed loop indicates bridge loss feedback to stabilize translation.</text>

  <text x="90" y="930" class="caption">Fig. 2. SelfRDB Model Architecture</text>
</svg>
